<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Card</title>
  <link rel="stylesheet" href="birthday.css" />
</head>
<body>
  <canvas id="balloonsCanvas"></canvas>

  <div class="card fade-in">
    <h1>🎉 Happy Birthday, Barsha! 🎂</h1>
    <p class="message">Wishing you a day filled with happiness and a year filled with joy.</p>

    <div class="gallery">
      <img src="image1.jpg" alt="Pic 1" />
      <img src="image2.jpg" alt="Pic 2" />
      <img src="image3.jpg" alt="Pic 3" />
    </div>

    <button onclick="showWishes(this)">Click for Surprise</button>
    <p id="wish" class="wish-text"></p>

    <audio id="birthdayMusic" src="birthday.mp3"></audio>
    <button onclick="toggleMusic()" class="music-button">Play Music</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script src="birthday.js"></script>
</body>
</html>
